[pytest]
# Only the project's own suite is collected. The two test_runner.py files that
# ship inside app/validation/**/ are standalone demo scripts for the vendored
# validators, not pytest tests: they execute on import and need sample data that
# is not in the repository, so bare `pytest` used to abort during collection.
testpaths = tests
norecursedirs = .git .venv Archived_code app/udp_tool erwinmodels sappdmodels
addopts = -q
